<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Tarefas | TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-background-glow"></div>

  <main class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="date-greeting">
          <span id="currentDate" class="date-badge">Carregando data...</span>
          <h1 class="app-title">Minhas Tarefas</h1>
        </div>
        <button id="themeToggle" class="icon-btn" aria-label="Alternar tema" title="Alternar tema claro/escuro">
          <!-- Ícone do Sol (Light) -->
          <svg class="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Ícone da Lua (Dark) -->
          <svg class="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>

      <!-- Barra de Progresso Geral -->
      <div class="progress-section">
        <div class="progress-info">
          <span class="progress-label">Progresso do dia</span>
          <span id="progressText" class="progress-percent">0%</span>
        </div>
        <div class="progress-bar-container">
          <div id="progressBar" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
      </div>
    </header>

    <!-- Formulário de Adicionar Tarefa -->
    <form id="taskForm" class="task-form">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="taskInput" 
          placeholder="O que você precisa realizar hoje?" 
          autocomplete="off"
          required
        >
        <select id="taskPriority" class="priority-select" title="Prioridade da tarefa">
          <option value="normal">Normal</option>
          <option value="alta">Alta</option>
          <option value="baixa">Baixa</option>
        </select>
        <button type="submit" id="addBtn" class="add-button" title="Adicionar tarefa">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Criar</span>
        </button>
      </div>
    </form>

    <!-- Barra de Filtros e Busca -->
    <div class="controls-bar">
      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="pending">Pendentes</button>
        <button class="filter-btn" data-filter="completed">Concluídas</button>
      </div>

      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Filtrar por texto...">
      </div>
    </div>

    <!-- Lista de Tarefas -->
    <ul id="taskList" class="task-list">
      <!-- Itens gerados dinamicamente via JavaScript -->
    </ul>

    <!-- Estado Vazio (Empty State) -->
    <div id="emptyState" class="empty-state">
      <div class="empty-icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <h3 id="emptyTitle">Tudo limpo por aqui!</h3>
      <p id="emptySubtitle">Adicione uma nova tarefa acima para começar seu dia produtivo.</p>
    </div>

    <!-- Rodapé com estatísticas e ações em lote -->
    <footer class="app-footer">
      <div class="tasks-counter">
        <span id="pendingCount">0</span> tarefas restantes
      </div>
      <button id="clearCompletedBtn" class="clear-btn" title="Excluir todas as tarefas concluídas">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Limpar concluídas
      </button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
